name: check-shows

on:
  schedule:
    # Off the top of the hour: GitHub drops or delays many :00 schedules.
    # GitHub's cron is best effort; see README for a reliable outside trigger.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "cron or manual (an outside scheduler sends cron so Pause is respected)"
        required: false
        default: manual

permissions:
  contents: read

jobs:
  check:
    # District and BookMyShow run side by side, so one being blocked never
    # stops the other. Set the repo variable BMS_IN_ACTIONS=false to drop
    # BookMyShow (for example if you run it from your own PC instead).
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(vars.BMS_IN_ACTIONS == 'false' && '["district"]' || '["district","bookmyshow"]') }}
    name: ${{ matrix.source }}
    # Runs on the self-hosted runners on the home PC (scripts/setup-runner.ps1):
    # District and BookMyShow both block GitHub's IPs. Two runners keep the two
    # sites in parallel. Runs queue while the PC is off.
    runs-on: [self-hosted, dunesday]
    timeout-minutes: 15
    # One run per source at a time; a run that overlaps waits instead of racing.
    concurrency:
      group: tracker-${{ matrix.source }}
      cancel-in-progress: false
    # BookMyShow failures don't turn the run red; admins still get one email
    # when it starts failing.
    continue-on-error: ${{ matrix.source == 'bookmyshow' }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check ${{ matrix.source }} for new shows
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt python -m tracker --source ${{ matrix.source }}
        env:
          PYTHONUTF8: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || inputs.trigger || 'manual' }}
